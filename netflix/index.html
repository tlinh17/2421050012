<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Trang chủ - Netflix</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <!-- Đầu trang -->
    <header>
        <!-- Danh mục -->
        <nav class="danh-muc">
            <ul class="danh-sach-muc">
                <img class="logo" src="../img/logo.svg" alt="">
                <li class="muc dang-chon"><a class="lien-ket-muc dang-chon" href="#">Trang chủ</a></li> 
                <li class="muc"><a class="lien-ket-muc" href="#">Nhân vật</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Series</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Phim</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Mới & Phổ biến</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Netflix của tôi</a></li>
                <li class="muc"><a class="lien-ket-muc" href="#">Duyệt tin theo ngôn ngữ</a></li>
            </ul>
        </nav>
        <div class="chuc-nang">
            <img class="avata" src="../img/avt.jpg" alt="">
        </div>

    </header>
    <!-- Nội dung chính trang -->
    <main>
        <div class="banner">
            <img class="banner-img" src="../img/banner.jpg" alt="">
        </div>
        <!-- Có thể bạn sẽ mê các tác phẩm này -->
        <div class="the-loai">
            <div class="ten-the-loai">
                <h3>Có thể bạn sẽ mê các tác phẩm này</h3>
            </div>
            <div class="danh-sach-phim">
                <div class="phim">
                    <img src="../img/1.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/2.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/3.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/4.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/5.jpg" alt="">
                </div>
            </div>
        </div>

        <!-- Động vật -->
         <div class="dong-vat">
            <div class="ten-the-loai">
                <h3>Động vật</h3>
            </div>
            <div class="danh-sach-phim">
                <div class="phim">
                    <img src="../img/10.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/6.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/7.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/8.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/9.jpg" alt="">
                </div>
            </div>
        </div>

        <!-- Phổ biển -->
         <div class="pho-bien">
            <div class="ten-the-loai">
                <h3>Phổ biến</h3>
            </div>
            <div class="danh-sach-phim">
                <div class="phim">
                    <img src="../img/11.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/12.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/13.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/14.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/15.jpg" alt="">
                </div>
            </div>
        </div>

    </main>
    <!-- Chân trang -->
    <footer>
        <!-- Nhân vật -->
         <div class="nhan-vat">
            <div class="ten-the-loai">
                <h3>Nhân vật</h3>
            </div>
            <div class="danh-sach-phim">
                <div class="phim">
                    <img src="../img/11.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/12.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/13.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/14.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/15.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/15.jpg" alt="">
                </div>
                <div class="phim">
                    <img src="../img/15.jpg" alt="">
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
