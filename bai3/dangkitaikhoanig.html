<html>
    <head>
        <title>Đăng ký tài khoản</title>
    </head>
    <body>
        <div>
            <font face = "time new romans" size = "3">Meta</font> <br>
            <b><font face = "time new romans" size = "5">Get started on Instagram</font></b> <br>
            <font face = "time new romans" size = "3">Sign up to see photos and videos from your friends.</font>
        </div>
        
        <form>

            <div>
                <b>Mobile number or email</b> <br>
                <input type = "tel" pattern = "([0]{1})([3,8,9]{1})([0-9]{8})" placeholder = "Mobile number or email"
                        type ="email">
            </div>

            <div>
                <font face = "time new romans" size = "3">You may receive notifications from us.</font>
                <font color = "blue">Learn why we ask for your contact information</font> <br>
            </div>

            <div>
                <b>Password</b> <br>
                <input type = "password" place holder = "Password">
            </div>

            <div>
                <b>Birthday</b><br>
                <select name = "Month">
                    <option value = "1">January</option>
                    <option value = "2">February</option>
                    <option value = "3">March</option>
                    <option value = "4">April</option>
                    <option value = "5">May</option>
                    <option value = "6">June</option>
                    <option value = "7">July</option>
                    <option value = "8">August</option>
                    <option value = "9">September</option>
                    <option value = "10">October</option>
                    <option value = "11">November</option>
                    <option value = "12">December</option>
                </select>
                
            </div>
        </form>
    </body>
</html>
