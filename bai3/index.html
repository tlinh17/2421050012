<html>
    <head>
        <title>Bài 3</title>
    </head>
    <body>
        <MARQUEE>
            <b>ha ha</b>
        </MARQUEE>
        <!-- ol Danh sách có thứ tự -->
        <ol>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ol>

        <!-- ul Danh sách không có thứ tự -->
        <ul>
            <li>C#</li>
            <li>Python</li>
            <li>JavaScript</li>
        </ul>

        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên</b> <br>
                <!--Nếu input k có type mặc định là text -->
                <!--Thuộc tính readonly sử dụng khi không muốn người dùng nhập thông tin vào input-->
                <!-- Placeholder hiện chữ mờ trong ô nhập -->
                <input type = "text" placeholder = "Họ và tên">
            </div>

            <div>
                <b>Năm sinh</b> <br>
                <input type = "number" placeholder = "Năm sinh">
            </div>

            <div>
                <b>Mật khẩu</b> <br>
                <input type = "password" placeholder = "Mật khẩu">
            </div>

            <div>
                <b>Giới thiệu bản thân</b> <br>
                <textarea>Nhập thông tin...</textarea>
            </div>

            <div>
                <b>Email</b> <br>
                <input type = "email">
            </div>

            <div>
                <!-- Số đầu tiên: 0 -->
                <!-- Số thức 2: 3,9,8 -->
                <!-- 8 số còn lại: 0-9 -->
                <b>Số điện thoại</b> <br>
                <input type = "tel" pattern = "([0]{1})([3,9,8]{1})([0-9]{8})">
            </div>
           
            <div>
                <b>Giới tính</b> <br>
                <input type = "radio" name = "gioitinh" value = "nam">Nam <br>
                <input type = "radio" name = "gioitinh" value = "nu">Nữ
            </div>

            <div>
                <b>Sở thích</b> <br>
                Chơi game: <input type = "checkbox" name = "sothich" value = "choigame"> <br>
                Nghe nhạc: <input type = "checkbox" name = "sothich" value = "nghenhac"> <br>
                Thể thao: <input type = "checkbox" name = "sothich" value = "thethao">
            </div>
            
            <div>
                <b>Trình duyệt web ưa thích</b><br>
                <select name = "browsers">
                    <option value = "Chrome">Chrome</option>
                    <option value = "Firefox">Firefox</option>
                    <option value = "Internet Explorer">Internet Explorer</option>
                    <option value = "Opera">Opera</option>
                    <option value = "Safari">Safari</option>
                    <option value = "Cốc Cốc">Cốc Cốc</option>
                </select>
            </div>

             0 <input type = "range" id = "a" value = "50"> 100 
            <div>
                <input type = "submit">
                <button>Xác nhận</button>
                <input type = "reset">
            </div>

        </form>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/t2XvRPRbKpk?si=AvWx6NvMsTxSj8Nm" ></iframe>

        <video controls width="560" height="315">
            <source src = "/anh/video.mp4" type = "video/mp4">
        </video>

        <audio controls>
                <source src = "/anh/xương rồng (intro).mp3" type = "audio/mp3">
        </audio>
    </body>
</html>
