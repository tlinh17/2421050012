<!DOCTYPE html>  <!--shift+chấm than tab hoặc ctrl cách enter-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color: pink;
            background-color: black;
        }
    </style>
    
</head>
<body>
    <!-- Cách 1: Inline style -->
    <!-- color: Quy định màu chữ -->
    <!-- background-color: Quy định màu nền -->
    <h1 style="color: blue; background-color: orange">Bài STYLE</h1>
    
    <!-- Cách 2: Internal Style -->
    <h2 style = "color:green">Cách 2: Internal Style</h2>

    <!-- Cách 3: External Style -->
    <h3>Cách 3: External Style</h3>
   
</body>
</html>
