<html>
    <head>
            <title>Bai 2 web</title>
    </head>

    <body>
       <!--Để chú thích dùng --> <!-- -->
       <!--Có 2 cách để chú thích nhanh trongg visual
            Cách 1: Ctrl + K + C
            Cách 2: Ctrl + /
        -->
        
        <!-- p: Thẻ phân đoạn-->
        <p>Môn web: Nhóm 04</p>
    
        <!-- H: để mục -->
        <h1>Tiêu đề 1</h1>
        <h2>Tiêu đề 2</h2>
        <h3>Tiêu đề 3</h3>

        <!-- Thẻ br để xuống dòng -->
        <p>
            Môn phát triển ứng dụng web<br>Nhóm 04
        </p>
    
        <div>Thẻ div chia khối</div>

        <b>Thẻ b để viết đậm</b> <br>
        <i>Thẻ i để viết nghiêng</i> <br>
        <u>Thẻ u để gạch chân</u> <br>
        <b><i><u>Nguyễn Thảo Linh</u></i></b>

        <div>
            <font face = "verdana">Phát triển ứng dụng web</font> <br>
            <font size = "10">Phát triển ứng dụng web</font> <br>
            <font color = "blue">Phát triển ứng dụng web</font>
        </div>

        <div>
            <font face = "arial" size = "5" color = "green">Nguyễn Thảo Linh</font>
        </div>

        <div>
            <!-- Định dạng chỉ số trên -->
            x<sup>2</sup>
            <br>
            <!-- Định dạng chỉ số dưới -->
            H<sub>2</sub>O
        </div>

        <!-- Chèn ảnh -->
        <div>
            <img src = "5.jpg">
        </div>
        

    </body>

</html>
